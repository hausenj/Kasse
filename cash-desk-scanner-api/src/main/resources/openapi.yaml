openapi: 3.0.0
info:
  title: Supermarket cash desk API
  version: 1.0.0
paths:
  /product/{productId}:
    get:
      summary: Get product information
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: product not found
components:
  schemas:
    Product:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created:
          type: string
          format: date-time
